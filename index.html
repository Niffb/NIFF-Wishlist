<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="A clean, minimal wishlist to save and manage product links across categories.">
  <title>NIFF's WISHLIST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NIFF's WISHLIST">
  <link rel="apple-touch-icon" href="favicon.svg">
</head>

<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title">NIFF'S WISHLIST</h1>
      <div class="wishlist-summary" id="wishlistSummary" style="display: none;">
        <span id="summaryText">0 items • £0.00</span>
      </div>
    </div>
    <div class="header-actions">
      <button id="refreshPricesBtn" class="btn-refresh-prices" title="Check all items for daily price updates">Refresh Prices</button>
      <button id="shareBtn" class="btn-share" aria-label="Share Wishlist" title="Share Wishlist">Share</button>
      <button id="authBtn" class="btn-auth">Login</button>
      <div id="userDisplay" class="user-display" style="display: none;">
        <span id="userEmail"></span>
        <button id="logoutBtn" class="btn-logout">Logout</button>
      </div>
    </div>
  </header>

  <!-- Category Navigation -->
  <nav class="category-nav">
    <div class="nav-inner">
      <button class="cat-tab active" data-category="all">All</button>
      <button class="cat-tab" data-category="priority">Priority</button>
      <button class="cat-tab" data-category="clothes">Clothes</button>
      <button class="cat-tab" data-category="tech">Tech</button>
      <button class="cat-tab" data-category="accessories">Accessories</button>
      <button class="cat-tab" data-category="health">Health</button>
      <button class="cat-tab" data-category="home">Home</button>
      <button class="cat-tab" data-category="misc">Misc</button>
      <button class="cat-tab" data-category="received" id="receivedTab" style="display: none;">Received</button>
      <div class="sort-wrapper">
        <label for="sortSelect" class="sort-label">Sort:</label>
        <select id="sortSelect" class="sort-select">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="price-low">Price: Low → High</option>
          <option value="price-high">Price: High → Low</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
    </div>
  </nav>

  <!-- Filters Bar -->
  <div class="filters-bar">
    <div class="filters-inner">
      <div class="search-wrapper">
        <span class="search-icon">⌕</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search wishlist...">
      </div>
      <div class="price-filter-wrapper">
        <label for="priceFilterSelect" class="sort-label">Price:</label>
        <select id="priceFilterSelect" class="sort-select">
          <option value="all">Any Price</option>
          <option value="under25">Under £25</option>
          <option value="25to50">£25 - £50</option>
          <option value="50plus">£50+</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="content">
    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">—</div>
      <p class="empty-hint" id="emptyHint">No items available in this view</p>
    </div>

    <!-- Wishlist Grid -->
    <div class="wishlist-grid" id="wishlistGrid"></div>
  </main>

  <!-- Add Item FAB -->
  <button class="fab" id="addBtn" aria-label="Add item">
    <span class="fab-icon">+</span>
  </button>

  <!-- Item Template -->
  <template id="itemTemplate">
    <article class="wishlist-item">
      <a href="" target="_blank" rel="noopener noreferrer" class="item-link">
        <div class="item-image-wrapper">
          <img class="item-image" src="" alt="" loading="lazy">
          <div class="item-badges">
             <!-- Badges injected here dynamically -->
          </div>
        </div>
        <div class="item-content">
          <div class="item-header">
            <h3 class="item-name"></h3>
            <span class="item-category"></span>
          </div>
          <p class="item-subcategory"></p>
          <p class="item-note"></p>
          <div class="item-footer">
            <span class="item-price"></span>
            <div class="item-domain-wrapper">
              <img class="item-favicon" src="" alt="" style="display: none;" width="16" height="16">
              <span class="item-domain"></span>
            </div>
          </div>
        </div>
      </a>
      <div class="item-actions">
        <!-- Injected dynamically: copy, edit, delete, reserve -->
      </div>
      <div class="reservation-badge" style="display: none;"></div>
    </article>
  </template>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 class="modal-title">Add to Wishlist</h2>
        <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      </div>
      <form id="itemForm" autocomplete="off">
        <div class="form-group">
          <label for="itemUrl">Product Link</label>
          <div class="url-input-row">
            <input type="url" id="itemUrl" placeholder="Paste a link and hit Fetch…" required>
            <button type="button" class="btn-fetch" id="fetchBtn">
              <span class="fetch-text">Fetch</span>
              <span class="fetch-spinner" id="fetchSpinner"></span>
            </button>
          </div>
        </div>
        <!-- Fetch preview -->
        <div class="fetch-preview" id="fetchPreview">
          <img class="fetch-preview-img" id="fetchPreviewImg" src="" alt="">
          <div class="fetch-preview-info">
            <div class="fetch-preview-title" id="fetchPreviewTitle"></div>
            <div class="fetch-preview-desc" id="fetchPreviewDesc"></div>
          </div>
        </div>
        <div class="form-group">
          <label for="itemName">Name</label>
          <input type="text" id="itemName" placeholder="e.g. Linen Shirt" required>
        </div>
        <div class="form-group">
          <label for="itemImage">Image URL <span class="optional">(auto-filled)</span></label>
          <div class="url-input-row">
            <input type="url" id="itemImage" placeholder="https://...">
            <button type="button" class="btn-fetch" id="findImgBtn" style="min-width: 90px;" title="Find product image">Find</button>
          </div>
        </div>
        <div class="form-group">
          <label for="itemNote">Note <span class="optional">(optional)</span></label>
          <input type="text" id="itemNote" placeholder="e.g. Size M, in cream">
        </div>
        <div class="form-group">
          <label for="itemVariant">Size / Volume / Weight <span class="optional">(auto-filled)</span></label>
          <input type="text" id="itemVariant" placeholder="e.g. 50ml, 100g, Pack of 2">
        </div>
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="itemPriority">
            <span class="checkbox-text">Mark as High Priority (Must Have)</span>
          </label>
        </div>
        <div class="form-group">
          <label for="itemCategory">Category</label>
          <select id="itemCategory" required>
            <option value="clothes">Clothes</option>
            <option value="tech">Tech</option>
            <option value="accessories">Accessories</option>
            <option value="health">Health</option>
            <option value="home">Home</option>
            <option value="misc">Misc</option>
          </select>
        </div>
        <div class="form-group" id="subcategoryGroup" style="display: none;">
          <label for="itemSubcategory">Subcategory</label>
          <select id="itemSubcategory">
            <option value="">— Select —</option>
            <option value="t-shirts">T-Shirts & Tees</option>
            <option value="shirts">Shirts & Polos</option>
            <option value="jumpers">Jumpers & Knitwear</option>
            <option value="hoodies">Hoodies & Sweatshirts</option>
            <option value="jackets">Jackets & Coats</option>
            <option value="trousers">Trousers & Jeans</option>
            <option value="shorts">Shorts</option>
            <option value="shoes">Shoes & Boots</option>
            <option value="suits">Suits & Tailoring</option>
            <option value="accessories">Watches & Accessories</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="itemPrice">Price <span class="optional">(auto-filled)</span></label>
          <input type="text" id="itemPrice" placeholder="e.g. £29.99">
        </div>
        <button type="submit" class="btn-submit" id="formSubmitBtn">Add Item</button>
      </form>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="authModalOverlay">
    <div class="modal auth-modal" id="authModal">
      <div class="modal-header">
        <h2 class="modal-title">Login</h2>
        <button class="modal-close" id="authModalClose" aria-label="Close">&times;</button>
      </div>
      <p class="auth-hint">Please enter the admin password to manage the wishlist.</p>
      <form id="authForm">
        <div class="form-group">
          <label for="authPassword">Password</label>
          <input type="password" id="authPassword" placeholder="••••••••" autocapitalize="none" autocorrect="off" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-submit" id="authSubmitBtn">Login</button>
      </form>
      <div id="authMessage" class="auth-message"></div>
    </div>
  </div>

  <!-- Guest Name Modal -->
  <div class="modal-overlay" id="guestNameOverlay">
    <div class="modal guest-name-modal" id="guestNameModal">
      <div style="display: flex; justify-content: flex-end; padding: 0.75rem 0.75rem 0;">
        <button class="modal-close" id="guestNameClose" aria-label="Close">&times;</button>
      </div>
      <div class="guest-name-hero" style="padding-top: 0.25rem;">
        <h2 class="guest-name-title">Welcome</h2>
        <p class="guest-name-subtitle">Enter your name so we know who's claiming gifts</p>
      </div>
      <form id="guestNameForm">
        <div class="form-group">
          <label for="guestNameInput">Your Name</label>
          <input type="text" id="guestNameInput" placeholder="e.g. Mum, Dad, Sarah..." required autocomplete="name" autocapitalize="words">
        </div>
        <button type="submit" class="btn-submit" id="guestNameSubmitBtn">Continue</button>
      </form>
    </div>
  </div>

  <!-- Price History Modal -->
  <div class="modal-overlay" id="historyModalOverlay">
    <div class="modal history-modal" id="historyModal">
      <div class="modal-header">
        <h2 class="modal-title" id="historyModalTitle">Price History</h2>
        <button class="modal-close" id="historyModalClose" aria-label="Close">&times;</button>
      </div>
      <div class="history-summary" id="historySummary">
        <!-- Summary stats injected here -->
      </div>
      <div class="history-timeline" id="historyTimeline">
        <!-- Timeline items injected here -->
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Toast -->
  <div class="toast" id="toast">
    <span class="toast-text">Item removed</span>
    <button class="toast-undo" id="toastUndo">Undo</button>
  </div>

  <script src="app.js"></script>
</body>

</html>
